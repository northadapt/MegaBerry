<!doctype html>
<html lang="en" data-theme="dark" data-review>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | MegaBerry</title>
  <meta name="description" content="Sign in to your MegaBerry account.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0a10">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body data-page="login">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="auth">
      <div class="auth__card">
        <div class="auth__head">
          <a class="auth__logo" href="index.html" aria-label="MegaBerry home"><img src="assets/img/logo-mark.png" alt="" width="44" height="44"><span>MegaBerry</span></a>
          <h1>Welcome back</h1>
          <p>Sign in to your MegaBerry account.</p>
          <p class="auth__notice" data-auth-notice hidden></p>
        </div>

        <div class="auth__social">
          <button class="gk-btn gk-btn--block" type="button" data-auth-provider="Google"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg><span>Google</span></button>
          <button class="gk-btn gk-btn--block" type="button" data-auth-provider="Apple"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg><span>Apple</span></button>
        </div>

        <div class="auth__or"><span>or</span></div>

        <form class="auth__form" data-login-form novalidate>
          <div class="field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required></div>
          <div class="field">
            <div class="auth__label-row"><label for="login-password">Password</label><a href="forgot-password.html">Forgot password?</a></div>
            <div class="auth__pw">
              <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button class="auth__eye" type="button" aria-label="Show password" aria-pressed="false" data-pw-toggle><svg class="eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
            </div>
          </div>
          <button class="gk-btn gk-btn--solid gk-btn--lg gk-btn--block" type="submit">Sign in</button>
          <p class="form__status" role="status" data-login-status></p>
        </form>


        <p class="auth__switch">New to MegaBerry? <a href="signup.html">Create an account</a></p>
      </div>
      <p class="auth__legal">By continuing you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
