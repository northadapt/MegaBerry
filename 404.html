    .nf { min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 4rem var(--gutter); position: relative; overflow: hidden; }

      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%);

      filter: blur(40px);
      animation: nf-pulse 6s ease-in-out infinite;
    }
    @keyframes nf-pulse { 0%,100% { opacity: 0.6; transform: translate(-50%,-55%) scale(1); } 50% { opacity: 1; transform: translate(-50%,-55%) scale(1.15); } }
    .nf__inner { position: relative; z-index: 1; display: grid; gap: 0; justify-items: center; }
    .nf__code {
      font-family: var(--font-mono); font-size: clamp(6rem, 15vw, 12rem); font-weight: 700;
      letter-spacing: 0.08em; line-height: 1;
      background: linear-gradient(180deg, var(--accent) 0%, rgba(155,123,234,0.3) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .nf h1 { font-size: clamp(1.5rem, 3vw, 2.25rem); letter-spacing: -0.03em; margin: 0 0 0.6rem; }
    .nf__sub { font-size: 1rem; color: var(--text-muted); margin: 0 0 2rem; max-width: 26rem; line-height: 1.5; }
    .nf__actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    .nf__actions .gk-btn { font-size: 0.95rem; padding: 0.65rem 1.6rem; }
    .nf__links { margin-top: 2.5rem; display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    .nf__links a { font-size: 0.85rem; color: var(--text-faint); text-decoration: none; transition: color 0.15s; }
    .nf__links a:hover { color: var(--accent); }
  </style>
